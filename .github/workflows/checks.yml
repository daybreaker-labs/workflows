name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test workflow programs
        run: python3 -m unittest discover -s scripts/tests
      - name: Install pinned workflow linters
        run: |
          tools="$RUNNER_TEMP/workflow-linters"
          mkdir -p "$tools"
          curl -fsSLo "$tools/actionlint.tar.gz" https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $tools/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$tools/actionlint.tar.gz" -C "$tools" actionlint
          curl -fsSLo "$tools/zizmor.tar.gz" https://github.com/zizmorcore/zizmor/releases/download/v1.30.1/zizmor-x86_64-unknown-linux-gnu.tar.gz
          echo "e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a  $tools/zizmor.tar.gz" | sha256sum -c -
          tar -xzf "$tools/zizmor.tar.gz" -C "$tools" zizmor
          echo "$tools" >> "$GITHUB_PATH"
      - name: Lint workflow syntax
        run: actionlint
      - name: Audit workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --persona=regular --format=github .
