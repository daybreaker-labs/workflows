name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04-arm' }}
    timeout-minutes: 10
    steps:
      - uses: useblacksmith/checkout@75c49b6ed30ce59336e9252425796cfcfac155f8 # v1.8.3
        with:
          persist-credentials: false
      - name: Test workflow programs
        run: python3 -m unittest discover -s scripts/tests
      - name: Install pinned workflow linters
        run: |
          tools="$RUNNER_TEMP/workflow-linters"
          mkdir -p "$tools"
          case $(uname -m) in
            x86_64) actionlint_arch=amd64; zizmor_arch=x86_64; actionlint_sha=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8; zizmor_sha=e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a ;;
            aarch64) actionlint_arch=arm64; zizmor_arch=aarch64; actionlint_sha=325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6; zizmor_sha=7ff1dce33bdd18fd2a4affe63bdd47efcccca97b2cec1c1863ec26e9e2647540 ;;
            *) echo 'Unsupported runner architecture'; exit 1 ;;
          esac
          curl -fsSLo "$tools/actionlint.tar.gz" "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_$actionlint_arch.tar.gz"
          echo "$actionlint_sha  $tools/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$tools/actionlint.tar.gz" -C "$tools" actionlint
          curl -fsSLo "$tools/zizmor.tar.gz" "https://github.com/zizmorcore/zizmor/releases/download/v1.30.1/zizmor-$zizmor_arch-unknown-linux-gnu.tar.gz"
          echo "$zizmor_sha  $tools/zizmor.tar.gz" | sha256sum -c -
          tar -xzf "$tools/zizmor.tar.gz" -C "$tools" zizmor
          echo "$tools" >> "$GITHUB_PATH"
      - name: Lint workflow syntax
        run: actionlint
      - name: Audit workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --persona=regular --format=github .
  testbox:
    # actionlint v1.7.12 rejects the `$/` self-repository form.
    uses: ./.github/workflows/testbox.yml # zizmor: ignore[self-repository]
    with:
      runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04-arm' }}
      timeout-minutes: 5
      setup: scripts/tests/fixtures/testbox-setup.sh
